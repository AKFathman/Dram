name: Deploy Supabase

# Manual: Actions → Deploy Supabase → Run workflow. Safe to re-run; every step
# is idempotent (the catalog seed is skipped once the table has rows).
#
# Repository secrets required:
#   SUPABASE_ACCESS_TOKEN  personal access token (sbp_...)
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_REF   the short project id from the dashboard URL
#   ANTHROPIC_API_KEY      for the identify-label edge function
#
# Optional, and the only way to get a 6-digit code into a sign-in email: a free
# Supabase project using the built-in mailer is not allowed to change its email
# templates, so its emails carry a link and no code. Setting these switches the
# project to your own SMTP provider, which lifts that restriction (and the
# built-in mailer's team-addresses-only rule and hourly cap along with it):
#   SMTP_HOST              e.g. smtp.resend.com
#   SMTP_PASS              the provider's API key or password
#   SMTP_SENDER_EMAIL      the From address, e.g. onboarding@resend.dev
#   SMTP_USER              optional, defaults to "resend"
#   SMTP_PORT              optional, defaults to 465
#   SMTP_SENDER_NAME       optional, defaults to "Dram"

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed flavor tags and the whiskey catalog (catalog is skipped if it already has rows)"
        type: boolean
        default: true
      functions:
        description: "Deploy edge functions, set their secrets, and wire the push webhook"
        type: boolean
        default: true
      configure_auth:
        description: "Apply auth settings: redirect URLs and the 6-digit email code template"
        type: boolean
        default: true

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, seed, deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
      SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v"; exit 1; }
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push

      - name: Seed
        if: inputs.seed
        run: |
          scripts/mgmt-sql.sh "$SUPABASE_PROJECT_REF" seed/00_flavor_tags.sql > /dev/null
          echo "flavor tags: ok"
          count=$(scripts/mgmt-sql.sh "$SUPABASE_PROJECT_REF" -c "select count(*)::int as n from public.whiskeys" | jq -r '.[0].n')
          if [ "$count" = "0" ]; then
            scripts/mgmt-sql.sh "$SUPABASE_PROJECT_REF" seed/catalog.sql > /dev/null
            echo "catalog: seeded"
          else
            echo "catalog: already has $count rows, skipping"
          fi

      - name: Fetch API keys
        id: keys
        run: |
          json=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
                   -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          anon=$(echo "$json" | jq -r '.[] | select(.name == "anon") | .api_key')
          service=$(echo "$json" | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$service"
          echo "anon=$anon" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Edge function secrets
        if: inputs.functions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Missing repository secret ANTHROPIC_API_KEY"; exit 1; }
          supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"

      - name: Deploy edge functions
        if: inputs.functions
        run: |
          supabase functions deploy identify-label
          supabase functions deploy send-push --no-verify-jwt

      - name: Push-notification webhook (notifications → send-push)
        if: inputs.functions
        continue-on-error: true
        env:
          SERVICE_KEY: ${{ steps.keys.outputs.service }}
        run: |
          cat > /tmp/webhook.sql <<SQL
          create extension if not exists pg_net with schema extensions;
          drop trigger if exists notifications_send_push on public.notifications;
          create trigger notifications_send_push
            after insert on public.notifications for each row
            execute function supabase_functions.http_request(
              'https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/send-push',
              'POST',
              '{"Content-Type":"application/json","Authorization":"Bearer $SERVICE_KEY"}',
              '{}',
              '5000'
            );
          SQL
          if scripts/mgmt-sql.sh "$SUPABASE_PROJECT_REF" /tmp/webhook.sql > /dev/null; then
            echo "webhook trigger: ok"
          else
            echo "::warning::Could not create the webhook trigger. Enable Database Webhooks once in the dashboard (Database → Webhooks) and re-run this workflow."
            exit 1
          fi

      # The Management API rejects the whole payload if any one field is bad, and
      # a rejection here used to be invisible: the body went to /dev/null and
      # continue-on-error hid the exit code, so the job reported success while
      # none of the settings landed — which is why sign-in emails arrived with no
      # code in them. Patch in groups, fall back to one field at a time, keep the
      # error body, and read the config back to prove the templates stuck.
      - name: Configure auth (redirect URLs, email code templates)
        if: inputs.configure_auth
        continue-on-error: true
        env:
          TMP: ${{ runner.temp }}
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          auth_header="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          failed=

          try_patch() {
            curl -sS --fail-with-body -X PATCH "$api" \
              -H "$auth_header" -H "Content-Type: application/json" \
              --data-binary @"$1" -o "$TMP/resp.json"
          }

          # Groups are applied in priority order, so a later rejection cannot
          # undo an earlier success.
          patch_group() {
            name=$1
            if try_patch "$TMP/$name.json"; then
              echo "auth config [$name]: ok"
              return 0
            fi
            echo "::warning::auth config [$name] rejected: $(cat "$TMP/resp.json")"
            cat "$TMP/resp.json" >> "$TMP/why.txt"
            for key in $(jq -r 'keys[]' "$TMP/$name.json"); do
              jq --arg k "$key" '{($k): .[$k]}' "$TMP/$name.json" > "$TMP/one.json"
              if try_patch "$TMP/one.json"; then
                echo "auth config [$key]: ok"
              else
                echo "::warning::auth config [$key] rejected: $(cat "$TMP/resp.json")"
                failed="$failed $key"
              fi
            done
          }

          # SMTP comes first: on a free project the built-in mailer forbids template
          # changes outright, so the groups below only stick once this has run.
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_PASS" ]; then
            jq -n \
              --arg host "$SMTP_HOST" \
              --arg port "${SMTP_PORT:-465}" \
              --arg user "${SMTP_USER:-resend}" \
              --arg pass "$SMTP_PASS" \
              --arg from "$SMTP_SENDER_EMAIL" \
              --arg name "${SMTP_SENDER_NAME:-Dram}" \
              '{
                smtp_host: $host, smtp_port: $port, smtp_user: $user, smtp_pass: $pass,
                smtp_admin_email: $from, smtp_sender_name: $name, smtp_max_frequency: 10
              }' > "$TMP/smtp.json"
            patch_group smtp
          else
            echo "no SMTP_HOST/SMTP_PASS secrets — leaving the built-in mailer in place"
          fi

          # A first-time user hits the CONFIRMATION template, not the magic-link
          # one, so both must carry {{ .Token }} or the email has no code in it.
          jq -n '{
            mailer_subjects_confirmation: "Your Dram sign-in code",
            mailer_templates_confirmation_content: "<h2>Welcome to Dram</h2><p>Your code is <strong>{{ .Token }}</strong>. It expires in 10 minutes.</p><p>Or <a href=\"{{ .ConfirmationURL }}\">tap here to finish signing up</a>.</p>"
          }' > "$TMP/confirmation.json"
          jq -n '{
            mailer_subjects_magic_link: "Your Dram sign-in code",
            mailer_templates_magic_link_content: "<h2>Sign in to Dram</h2><p>Your code is <strong>{{ .Token }}</strong>. It expires in 10 minutes.</p><p>Or <a href=\"{{ .ConfirmationURL }}\">tap here to sign in</a>.</p>"
          }' > "$TMP/magic_link.json"
          jq -n '{
            mailer_otp_length: 6,
            mailer_otp_exp: 600,
            external_email_enabled: true,
            mailer_autoconfirm: false
          }' > "$TMP/otp.json"
          jq -n '{
            site_url: "dram://auth/callback",
            uri_allow_list: "dram://auth/callback,exp://**"
          }' > "$TMP/redirect.json"

          patch_group confirmation
          patch_group magic_link
          patch_group otp
          patch_group redirect

          [ -z "$failed" ] || echo "::warning::fields the API would not accept:$failed"

          # The only check that has to pass: does a sign-in email carry a code?
          # Read the settings back rather than trusting the PATCH responses.
          curl -sS --fail-with-body "$api" -H "$auth_header" -o "$TMP/current.json"
          missing=
          for f in mailer_templates_confirmation_content mailer_templates_magic_link_content; do
            if jq -e --arg f "$f" '(.[$f] // "") | contains("{{ .Token }}")' "$TMP/current.json" > /dev/null; then
              echo "$f: contains the 6-digit code"
            else
              missing="$missing $f"
            fi
          done

          if [ -n "$missing" ]; then
            if grep -qi 'custom SMTP\|free tier' "$TMP/why.txt" 2>/dev/null; then
              echo "::error::This project may not change its email templates while it uses Supabase's built-in mailer, so sign-in emails carry a link but no 6-digit code. Tapping the link still signs you in. To get the code, set the SMTP_* repository secrets documented at the top of this workflow and re-run it."
            else
              echo "::error::sign-in emails will arrive without a code —$missing has no {{ .Token }}"
            fi
            exit 1
          fi
          echo "auth config: email codes confirmed"

      - name: Summary
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon }}
        run: |
          {
            echo "## Dram — Supabase deploy"
            echo
            echo "Project URL: \`https://$SUPABASE_PROJECT_REF.supabase.co\`"
            echo
            echo "Copy these into \`apps/mobile/.env\` (the anon key ships inside the app; row-level security protects the data):"
            echo
            echo '```'
            echo "EXPO_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo '```'
            echo
            echo "Still manual: Apple and Google sign-in providers (Authentication → Providers) and making yourself a moderator (\`update public.profiles set is_moderator = true where username = '...'\`)."
          } >> "$GITHUB_STEP_SUMMARY"
